name: Checks

on:
  push:
    branches: [main, feat/possession-pipeline]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check possession tests
      - name: Format
        run: uv run ruff format --check possession tests
      - name: Type Check
        run: uv run pyright
      - name: Tests With Coverage
        run: uv run pytest
